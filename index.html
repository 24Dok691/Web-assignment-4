<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="qw">
    <div class="head">
      <h1>Forms</h1>
      <nav class="ahref">
        <a href="index.html" class="active">Contact</a>
        <a href="bootstrap-form.html">Bootstrap-form</a>
        <a href="validation.html">Validation</a>
        <a href="register.html">Registration</a>
      </nav>
    </div>
  </header>
  <main>
      <form action="#" method="post">
        <div class="profile-card">
          <h1 class="text-center">Contact us</h1>
          <div class="fl">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name"
            required minlength="2" maxlength="50"
            pattern="[A-Za-zА-Яа-яЁё\s]+"
            title="Only letters and spaces, 2 to 50 characters">
          </div>
          <div class="fl">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
            required maxlength="100">
          </div>
          <div class="fl">
            <label for="message">Message</label>
            <textarea id="message" name="message"
            rows="4" required minlength="10" maxlength="500"></textarea>
          </div>
          <button type="submit" class="send">Send message</button>
        </div>
      </form>
  </main>
  <footer class="acc text-center">
    <p class="mb-0">&copy; 2026 Temirzakhov Adilzhan &bull;
      <a href="https://github.com/24Dok691">My GitHub</a></p>
  </footer>
</body>
</html>
